name: One-time exact source copy
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/one-time-copy.yml'
permissions:
  contents: write
jobs:
  duplicate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Copy source repository at fixed commit and verify
        shell: bash
        run: |
          set -euo pipefail
          git clone --no-checkout https://github.com/MarcW88/cafetiere-italienne.git /tmp/moka-source
          git -C /tmp/moka-source checkout --detach 6c41c4ce280b1d3e9b41213f4b1bff9e68e38148
          rsync -a --delete --exclude='.git/' /tmp/moka-source/ ./
          git add -A
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'chore: duplicate cafetiere-italienne snapshot [skip ci]'
          git push origin HEAD:main
          test "$(git ls-tree -r --name-only HEAD | wc -l)" -eq "$(git -C /tmp/moka-source ls-tree -r --name-only HEAD | wc -l)"
          diff -u <(git ls-tree -r HEAD | sed 's/^[^ ]* / /') <(git -C /tmp/moka-source ls-tree -r HEAD | sed 's/^[^ ]* / /')
